name: strategy tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt

      - name: MVE tests
        working-directory: strategies/mve
        run: python -m unittest discover -s tests -v
      - name: MVE synthetic demo
        working-directory: strategies/mve
        run: python run_local.py --demo --output output/demo.json
      - name: MVE compile check
        working-directory: strategies/mve
        run: python -m compileall -q stock_strategy examples run_local.py

      - name: Episodic Pivot tests
        working-directory: strategies/episodic_pivot
        run: python -m unittest discover -s tests -v
      - name: Episodic Pivot compile check
        working-directory: strategies/episodic_pivot
        run: python -m compileall -q episodic_pivot
